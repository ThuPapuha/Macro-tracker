# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Generate the project with:  brew install xcodegen && xcodegen
name: MacroTracker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  MacroTracker:
    type: application
    platform: iOS
    sources:
      - path: MacroTracker
    settings:
      base:
        INFOPLIST_FILE: MacroTracker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: MacroTracker
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  MacroTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacroTrackerTests
    dependencies:
      - target: MacroTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
  MacroTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MacroTrackerUITests
    dependencies:
      - target: MacroTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
schemes:
  MacroTracker:
    build:
      targets:
        MacroTracker: all
        MacroTrackerTests: [test]
        MacroTrackerUITests: [test]
    test:
      targets:
        - MacroTrackerTests
        - MacroTrackerUITests
