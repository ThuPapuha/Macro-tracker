name: Build & deploy

on:
  push:
    branches: ["**"]
    # The iOS app has its own workflow; its changes do not need a new APK.
    paths-ignore: ["**.md", "ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    name: Deploy backend (Supabase)
    # Only from main or when started by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '150' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in GEMINI_API_KEY SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Backend no desplegado::Faltan en el environment 'production':$missing (ver README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Supabase project
        if: steps.config.outputs.ready == 'true'
        run: bash supabase/provision.sh setup

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Store Gemini key as Edge Function secret
        if: steps.config.outputs.ready == 'true'
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=%s\nAI_DAILY_LIMIT=%s\n' \
            "$GEMINI_API_KEY" "$GEMINI_MODEL" "$AI_DAILY_LIMIT" > "$RUNNER_TEMP/functions.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/functions.env"
          rm -f "$RUNNER_TEMP/functions.env"

      - name: Deploy Edge Function
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy gemini --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Smoke test (login, database, Gemini)
        if: steps.config.outputs.ready == 'true'
        # Report problems (e.g. an invalid Gemini key) without blocking the APK release.
        continue-on-error: true
        run: bash supabase/provision.sh smoke-test

  android:
    name: Build APK
    needs: backend
    if: ${{ !cancelled() && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Supabase settings
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            bash supabase/provision.sh app-env
          elif [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          else
            echo "::warning title=Sin servidor::Falta SUPABASE_ACCESS_TOKEN: el APK funcionará sin grupos ni IA del servidor."
          fi

      - name: Use private keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          apk="MacroTracker-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Read by the in-app updater through releases/latest/download/version.json.
          jq -n --argjson code "${{ github.run_number }}" --arg apk "$apk" --argjson size "$(stat -c%s "$apk")" \
            '{versionCode: $code, versionName: ("1.0." + ($code | tostring)), tag: ("build-" + ($code | tostring)), apk: $apk, size: $size}' \
            > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: MacroTracker-apk
          path: MacroTracker-*.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Macro Tracker ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            MacroTracker-${{ github.run_number }}.apk
            version.json
          body: |
            Descarga **MacroTracker-${{ github.run_number }}.apk** desde tu Android e instálalo
            (permite "instalar apps desconocidas" para tu navegador si te lo pide).
            Las nuevas versiones se instalan encima de la anterior sin perder tus datos.
