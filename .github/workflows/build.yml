name: Build & deploy

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    name: Deploy backend (Supabase)
    # Only from main or when started by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '150' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in GEMINI_API_KEY SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Backend no desplegado::Faltan en el environment 'production':$missing (ver README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply database schema
        if: steps.config.outputs.ready == 'true'
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > "$RUNNER_TEMP/schema.json"
          status=$(curl -sS -o "$RUNNER_TEMP/result.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/schema.json")
          if [ "$status" -ge 300 ] || jq -e 'type == "object" and has("message")' "$RUNNER_TEMP/result.json" > /dev/null; then
            cat "$RUNNER_TEMP/result.json"
            echo "::error title=Esquema SQL::No se pudo aplicar supabase/schema.sql (HTTP $status)"
            exit 1
          fi
          echo "Esquema aplicado."

      - name: Enable anonymous sign-ins
        if: steps.config.outputs.ready == 'true'
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/auth.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"external_anonymous_users_enabled": true}')
          if [ "$status" -ge 300 ]; then
            echo "::warning title=Login anónimo::No se pudo activar automáticamente (HTTP $status). Actívalo en Supabase: Authentication → Sign In / Providers → Allow anonymous sign-ins."
          else
            echo "Login anónimo activado."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Store Gemini key as Edge Function secret
        if: steps.config.outputs.ready == 'true'
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=%s\nAI_DAILY_LIMIT=%s\n' \
            "$GEMINI_API_KEY" "$GEMINI_MODEL" "$AI_DAILY_LIMIT" > "$RUNNER_TEMP/functions.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/functions.env"
          rm -f "$RUNNER_TEMP/functions.env"

      - name: Deploy Edge Function
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy gemini --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  android:
    name: Build APK
    needs: backend
    if: ${{ !cancelled() && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Supabase settings
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Sin servidor::Falta SUPABASE_PROJECT_REF: el APK funcionará sin grupos ni IA del servidor."
            exit 0
          fi
          echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          if [ -z "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            # Client-side key (publishable, or the legacy anon key). It is meant to be public.
            key=$(curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=false" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | jq -r '([.[] | select(.type == "publishable")][0].api_key) // ([.[] | select(.name == "anon")][0].api_key) // empty')
            if [ -n "$key" ]; then
              echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
            else
              echo "::warning::No se encontró la clave pública de Supabase; define SUPABASE_ANON_KEY."
            fi
          fi

      - name: Use private keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "MacroTracker-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MacroTracker-apk
          path: MacroTracker-*.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Macro Tracker ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: MacroTracker-${{ github.run_number }}.apk
          body: |
            Descarga **MacroTracker-${{ github.run_number }}.apk** desde tu Android e instálalo
            (permite "instalar apps desconocidas" para tu navegador si te lo pide).
            Las nuevas versiones se instalan encima de la anterior sin perder tus datos.
